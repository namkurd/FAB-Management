name: IR eligibility check

# Thu-Mon at 7:00am Eastern (12:00 UTC = EST, which covers the rest of the NFL season).
# Posts to Slack (#management webhook) ONLY when a player is on IR illegally.
on:
  schedule:
    - cron: "0 12 * * 0,1,4,5,6"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Send a test message to Slack to verify the webhook"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Slack webhook test
        if: ${{ inputs.test_message }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          url=$(printf '%s' "$SLACK_WEBHOOK_URL" | tr -d ' \r\n"'"'"'')
          case "$url" in
            https://hooks.slack.com/services/*) ;;
            "") echo "::error::Repo secret SLACK_WEBHOOK_URL is empty or missing (check the exact name)"; exit 1 ;;
            *) echo "::error::SLACK_WEBHOOK_URL is not a Slack webhook URL. It must start with https://hooks.slack.com/services/ and contain nothing else. Re-copy it from api.slack.com/apps > IR Check > Incoming Webhooks and re-save the secret."; exit 1 ;;
          esac
          curl -sSf -X POST -H 'Content-type: application/json' \
            --data '{"text":"✅ IR check webhook test: the daily IR eligibility check can post here."}' \
            "$url"

      - name: Run IR check (posts only if there are violations)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python3 ir_check.py --violations-only --post | tee -a "$GITHUB_STEP_SUMMARY"
