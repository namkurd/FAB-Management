name: IR eligibility check

# Run from the Actions tab ("Run workflow") or from Slack via the /ircheck relay in slack_relay/.
# Posts to Slack when the SLACK_WEBHOOK_URL repo secret is set; always writes the run summary.
on:
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week to check (blank = current week)"
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run IR check
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WEEK: ${{ inputs.week }}
        run: |
          args=""
          [ -n "$WEEK" ] && args="--week $WEEK"
          [ -n "$SLACK_WEBHOOK_URL" ] && args="$args --post"
          python3 ir_check.py $args | tee -a "$GITHUB_STEP_SUMMARY"
